[project]
name = "bigsim"
version = "0.1.0"
description = "Educational simulator program — shared, separately-validated solver engines + simulators."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
# Visualization is opt-in (ADR 0002): the compute core and the test suite stay
# headless/matplotlib-free; only the render layer (projects/steel/plots.py, demos,
# notebooks) needs this. Install with `pip install -e .[viz]`.
viz = ["matplotlib>=3.7"]
# The teaching notebook (Steel plan §9, slice 1) is opt-in: only projects/steel/steel.ipynb
# and its execution smoke-test (tests/test_steel_notebook.py) need ipywidgets (the live
# sliders) + the nbclient/nbformat/ipykernel machinery that runs the notebook headless.
# matplotlib stays in [viz], so the full runnable combo is `pip install -e .[viz,notebook]`;
# the committed suite stays notebook-free (the smoke-test is importorskip/kernelspec-gated).
notebook = ["ipywidgets>=8", "nbclient", "nbformat", "ipykernel"]
# CALPHAD backend is opt-in (Steel Phase 4): only projects/steel/calphad_backend.py
# (+ its demo/live tests) needs pycalphad; the committed Phase-4 tests validate fe_c
# against a frozen reference table and stay pycalphad-free. Thermodynamic databases
# are never bundled (plan §6); the Fe-C one ships inside pycalphad, the multicomponent
# steel one is fetched by calphad_backend.download_mc_fe().
#   NOTE (Python 3.14): pycalphad pins `symengine<0.14`, but only symengine 0.14.1 has
#   a 3.14 wheel. Override the cap with a two-step install:
#       pip install symengine==0.14.1
#       pip install 'pycalphad>=0.11' --no-deps
#       pip install xarray pint tinydb runtype pandas
#   (On Python <3.14 a plain `pip install -e .[calphad]` resolves normally.)
calphad = ["pycalphad>=0.11"]

# Single-command test runner config (ARCHITECTURE.md §6 / steel plan §7).
# `pythonpath = ["."]` puts the repo root on sys.path so tests import the
# engines as `engines.diffusion...` (and projects as `projects.steel...`)
# without an install step.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["engines", "projects"]
addopts = "-q"

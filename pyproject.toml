# Build config exists for ONE consumer: full-gate CI (`pip install -e .[…]` to pull the
# optional stacks). Local dev never installs — pytest's `pythonpath = ["."]` (below) puts
# the repo root on sys.path, so `engines.*` / `projects.*` import without a build step. The
# flat layout has two top-level packages, which setuptools won't auto-discover, so name them
# explicitly here (else `pip install -e .` fails with "Multiple top-level packages discovered").
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engines*", "projects*"]

[project]
name = "bigsim"
version = "0.1.0"
description = "Educational simulator program — shared, separately-validated solver engines + simulators."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
# Visualization is opt-in (ADR 0002): the compute core and the test suite stay
# headless/matplotlib-free; only the render layer (projects/steel/plots.py, demos,
# notebooks) needs this. Install with `pip install -e .[viz]`.
viz = ["matplotlib>=3.7"]
# The teaching notebooks (Steel plan §9 slice 1 = steel.ipynb; Microchip §9 = chip.ipynb) are
# opt-in. This extra carries two things: (1) jupyterlab — the interactive frontend a human opens
# the notebook in (`jupyter lab projects/.../X.ipynb`); and (2) the headless run stack — ipywidgets
# (the live sliders) + nbclient/nbformat/ipykernel — which the execution smoke-tests
# (tests/test_steel_notebook.py, tests/test_chip_notebook.py) use to run the notebooks without a
# browser. matplotlib stays in [viz], so the full runnable combo is `pip install -e .[viz,notebook]`.
# The committed suite stays notebook-free regardless (each smoke-test is slow-marked and
# importorskip/kernelspec-gated, and none import jupyterlab — it is editor-only, not test-required).
notebook = ["jupyterlab>=4", "ipywidgets>=8", "nbclient", "nbformat", "ipykernel"]
# The Streamlit what-if app (Steel plan §9, slice 2) is opt-in: only projects/steel/app.py
# (the shareable slider UI) needs streamlit. Its compute helpers are pure sweep re-composition
# (streamlit/matplotlib-free), so tests/test_app.py stays in the always-green committed suite;
# only `streamlit run app.py` needs this extra. matplotlib stays in [viz] (the figures), so the
# full runnable combo is `pip install -e .[viz,app]` — mirroring the notebook's `.[viz,notebook]`.
app = ["streamlit>=1.30"]
# CALPHAD backend is opt-in (Steel Phase 4): only projects/steel/calphad_backend.py
# (+ its demo/live tests) needs pycalphad; the committed Phase-4 tests validate fe_c
# against a frozen reference table and stay pycalphad-free. Thermodynamic databases
# are never bundled (plan §6); the Fe-C one ships inside pycalphad, the multicomponent
# steel one is fetched by calphad_backend.download_mc_fe().
#   NOTE (Python 3.14): pycalphad pins `symengine<0.14`, but only symengine 0.14.1 has
#   a 3.14 wheel. Override the cap with a two-step install:
#       pip install symengine==0.14.1
#       pip install 'pycalphad>=0.11' --no-deps
#       pip install xarray pint tinydb runtype pandas
#   (On Python <3.14 a plain `pip install -e .[calphad]` resolves normally.)
calphad = ["pycalphad>=0.11"]
# Climate reference is opt-in (Planet Phase 1): only the live climlab cross-check
# (projects/planet/climate_reference.py + its slow test) needs climlab. The committed Phase-1
# tests validate the EBM against analytic anchors + a frozen reference table and stay climlab-free;
# climlab is consumed as a reference tool (the pycalphad pattern), never copied. Install with
# `pip install -e .[climate]`. The live cross-check test is slow-marked + importorskip-gated, so a
# clean checkout skips it.
climate = ["climlab>=0.8"]

# Single-command test runner config (ARCHITECTURE.md §6 / steel plan §7).
# `pythonpath = ["."]` puts the repo root on sys.path so tests import the
# engines as `engines.diffusion...` (and projects as `projects.steel...`)
# without an install step.
#
# Tiered gate (ADR 0003 — docs/decisions/0003-test-execution-policy.md):
#   * Per-project   : `python -m tools.gate <name> -m "not slow"` → the routine gate
#                       once a project is named (its own tests + the tests of the modules
#                       it uses, per the tools/gate.py manifest). The ADR 0003 Successor.
#   * Routine commit : `pytest -m "not slow"` → whole-repo fast lane (~8 s), incl.
#                       the frozen-engine tests (the "used modules"). The gate before
#                       an ordinary commit when the change spans projects.
#   * Full gate      : `pytest`               → everything (the tracked suite). Run only
#                       in EXCEPTIONAL cases: a shared engines/ edit, a root-config
#                       change, a release, or CI.
#   * Docs-only      : no gate.
#   * Scoped dev     : `pytest projects/<name>` while iterating on one module.
# `slow` marks the handful of tests that drive a live external solver / kernel /
# subprocess (the pycalphad solves, the notebook-kernel execution).
[tool.pytest.ini_options]
pythonpath = ["."]
# `tools` collects the per-project gate's own self-check (tools/tests); the gate
# manifest + runner live in tools/gate.py (not a shipped package — see pyproject's
# packages.find, which includes only engines*/projects*).
testpaths = ["engines", "projects", "tools"]
addopts = "-q"
markers = [
    "slow: drives a live external solver / kernel / subprocess; deselect in the inner loop with -m 'not slow' (ADR 0003)",
]
